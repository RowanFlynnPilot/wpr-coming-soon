name: build
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"   # ~05:17 America/Chicago
  push:
    paths:
      - "data/overrides/**"   # an editor's commit publishes within minutes
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python -m pipeline
      - name: Commit data
        # always(): the ledger is saved before merge/build run, so a gate or
        # override failure must still commit tonight's signals — otherwise a
        # transfer that rolls off the sibling feed meanwhile is lost for good.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ data/signals_ledger.json
          git diff --staged --quiet || git commit -m "data: nightly build"
          for attempt in 1 2 3; do   # an editor may push meanwhile
            git pull --rebase origin main && git push && break
            sleep 15
          done
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Ship the data next to the widget
        run: |
          cp public/locations.json public/queue.json web/dist/
          python scripts/enrich_geo.py web/dist/locations.json web/dist/queue.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - uses: actions/deploy-pages@v5
