name: build
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"   # ~05:17 America/Chicago
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python -m pipeline
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ data/transfers_ledger.json
          git diff --staged --quiet || git commit -m "data: nightly build"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Ship the data next to the widget
        run: |
          cp public/locations.json public/queue.json web/dist/
          python scripts/enrich_geo.py web/dist/locations.json web/dist/queue.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - uses: actions/deploy-pages@v4
