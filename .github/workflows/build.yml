name: build
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"   # ~05:17 America/Chicago
  push:
    paths:
      - "data/overrides/locations.yaml"   # an editor's commit publishes within minutes
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python -m pipeline
      - name: Commit data
        # always(): the ledger is saved before merge/build run, so a gate or
        # override failure must still commit tonight's signals — otherwise a
        # transfer that rolls off the sibling feed meanwhile is lost for good.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ data/signals_ledger.json
          git diff --staged --quiet || git commit -m "data: nightly build"
          # Someone may push meanwhile (an editor, or a queued twin of this
          # run). On a conflict in the regenerated files this run's output
          # wins (-X theirs favors the replayed commit); a failed rebase is
          # aborted before retrying, and three failures fail the job loudly —
          # never ship a working tree with conflict markers in it.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 3 ]; then
              echo "::error::could not push data after 3 attempts"; exit 1
            fi
            sleep 15
          done
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Ship the data next to the widget
        run: |
          cp public/locations.json public/queue.json web/dist/
          python scripts/enrich_geo.py web/dist/locations.json web/dist/queue.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - uses: actions/deploy-pages@v5
