[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wpr-coming-soon"
version = "0.1.0"
description = "What's going in that building? Signal pipeline for the WPR Coming Soon tracker."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["pipeline", "pipeline.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
